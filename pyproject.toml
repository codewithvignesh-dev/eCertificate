[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litz-tech-ecertificate"
version = "1.0.0"
description = "Production-ready eCertificate generation platform for GAMKERS"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "GAMKERS"}
]
dependencies = [
    "Flask==3.1.2",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.2.2",
    "Flask-Limiter==3.12",
    "PyMySQL==1.1.2",
    "python-dotenv==1.1.1",
    "pandas==2.3.2",
    "openpyxl==3.1.5",
    "xlrd==2.0.1",
    "reportlab==4.4.3",
    "email-validator==2.3.0",
    "gunicorn==23.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]