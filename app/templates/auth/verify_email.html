{% extends "base.html" %}

{% block title %}Verify Email{% endblock %}

{% block content %}
<div class="flex min-h-[70vh] items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="card p-6 sm:p-8">
            <div class="mb-6 text-center">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-blue-100 text-blue-600">
                    <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l9 6 9-6M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Verify your email</h1>
                <p class="mt-2 text-sm text-slate-500">Please verify your email address to continue.</p>
            </div>

            {% if message %}
            <div class="mb-5 rounded-lg border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-700">
                {{ message }}
            </div>
            {% endif %}

            <div class="text-center">
                <a href="{{ url_for('auth.signin') }}" class="font-medium text-blue-600 hover:text-blue-700">
                    Back to Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
