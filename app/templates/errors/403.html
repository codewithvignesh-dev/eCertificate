{% extends "base.html" %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="flex min-h-[70vh] items-center justify-center px-4 py-12">
    <div class="max-w-lg text-center">
        <p class="text-7xl font-bold text-slate-200">403</p>
        <h1 class="mt-4 text-3xl font-bold text-slate-900">Access Denied</h1>
        <p class="mt-3 text-slate-500">You do not have permission to access this page.</p>
        <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('main.landing') }}" class="mt-6 inline-flex rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">
            Go Back
        </a>
    </div>
</div>
{% endblock %}
